[package]
name = "safegraphs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The SafeTensors of graphs: a memory-mappable interchange format for flat search graphs"
repository = "https://github.com/ashvardanian/SafeGraphs"
readme = "README.md"
categories = ["data-structures", "science", "memory-management"]
keywords = ["ann", "graph", "mmap", "vector-search", "safetensors"]

# The whole reader lives in one file.
[lib]
path = "safegraphs.rs"

[dependencies]

# Standard, well-maintained memory mapping. Reading is zero-copy: the mmap'd
# bytes are reinterpreted as typed slices in place, never copied out.
memmap2 = "0.9"

# Allocator-aware, fallible containers. Pinned to match jsontape's major so the
# `Json<A>` header and our columns share one `Allocator` trait.
allocator-api2 = "0.4"

# Allocator-aware JSON parser for the header, keeping strings as zero-copy spans.
jsontape = { path = "../JsonTape" }

# Variable-length string and list tapes: offsets + concatenated bytes, matching
# the on-disk offsets_* / values_* layout of utf8 and variable-degree columns.
# Declared from the registry, not from git, because StringZilla declares it that
# way too: a git source here would resolve to a second, distinct crate, and our
# `BytesTapeView` would then not be the type StringZilla's `AnyBytesTape` holds.
stringtape = "2.4"

# Pulled in only by the `search` feature.

# NumKong scoring kernels: Dot, Spatial, Cosine, Hamming, Jaccard, geospatial,
# MaxSim for late interaction, and Kabsch/Umeyama for point meshes. `parallel`
# gates the whole `DotsPackedParallelOps` surface — without it the pool-taking
# kernels a dense scanner drives are compiled out entirely.
numkong = { git = "https://github.com/ashvardanian/NumKong", branch = "main-v8", features = [
    "parallel",
], optional = true }

# StringZilla sequence scoring: Levenshtein, Needleman-Wunsch, Smith-Waterman,
# plus sha256 for manifest integrity. `cpus` gates the `szs` module, which is
# where every batch engine, `DeviceScope`, and `UnifiedMat` lives; add `cuda`
# alongside it to move the same engines onto a GPU.
stringzilla = { git = "https://github.com/ashvardanian/StringZilla", features = [
    "cpus",
], optional = true }

# ForkUnion structured parallelism, fanning scans across queries and shards.
# Declared from the registry for the same reason as `stringtape`, and with sharper
# consequences: NumKong and StringZilla both declare `forkunion = "3.0"` there, and
# the crate carries `links = "forkunion"`. A git source here is a second, distinct
# package claiming the same native library, which Cargo refuses to resolve at all.
forkunion = { version = "3.0", optional = true }

# Argument parsing and glob expansion for the `sg` binary alone — the library
# stays free of both. `clap`'s derive is an attribute macro on our types, not a
# `macro_rules!` definition, so it sits outside the crate's macro ban.
clap = { version = "4", features = ["derive"], optional = true }
glob = { version = "0.3", optional = true }

[features]
# The default build only reads and unpacks files: mmap, header parse, and
# zero-copy typed columns. No kernels, no threads.
default = []

# Scan and A* over the graph, with every scoring kernel: pulls NumKong,
# StringZilla, and ForkUnion.
search = ["dep:numkong", "dep:stringzilla", "dep:forkunion"]

# The `sg` command-line front end over `search/dispatch.rs`.
cli = ["search", "dep:clap", "dep:glob"]

[[bin]]
name = "sg"
path = "cli.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A no-unwind backstop consistent with the never-panic design.
panic = "abort"
